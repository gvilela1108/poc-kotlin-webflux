# Application
spring.application.name=poc-kotlin-webflux
server.port=${SERVER_PORT:8080}

# Database - configure through environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# OpenFeign
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=10000
spring.cloud.openfeign.client.config.default.loggerLevel=none

# SandboxClient API
sandboxclient.api.base-url=${SANDBOXCLIENT_API_BASE_URL}
sandboxclient.api.private-key=${SANDBOXCLIENT_API_PRIVATE_KEY}
sandboxclient.api.page-size=100

# Logging
logging.level.root=INFO
logging.level.com.sandboxclient=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never

# Distributed Tracing
management.tracing.enabled=true
management.tracing.sampling.probability=0.1

# Metrics tags
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${ENVIRONMENT:prod}

# OpenAPI / Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.sandboxclient.sliding-window-size=10
resilience4j.circuitbreaker.instances.sandboxclient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.sandboxclient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sandboxclient.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.sandboxclient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.sandboxclient.automatic-transition-from-open-to-half-open-enabled=true